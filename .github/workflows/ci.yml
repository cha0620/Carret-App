name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    name: free unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: pytest (free)
        run: pytest backend/test/software -q

  eval:
    name: paid eval (main only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      VLM_KEY: ${{ secrets.VLM_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: pytest (paid eval)
        run: pytest backend/test/eval -m eval -q
