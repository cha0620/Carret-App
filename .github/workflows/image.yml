name: image

# 배포용 컨테이너 이미지 → GHCR (ghcr.io/<owner>/carret-app). RunPod Pod 가 이 이미지를 받아 띄운다 (deploy/RUNPOD.md).
# main 에 머지될 때마다가 아니라, 배포하고 싶을 때만: Actions 탭에서 수동 실행하거나 v* 태그를 푸시한다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # latest 는 Pod 가 재시작 때 받는 이미지 — 기능 브랜치에서 수동 실행해 덮어쓰지 않게 main · 태그에서만 (11-15 리뷰)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # GHCR 이름은 소문자만
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64      # RunPod Pod 는 amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.name.outputs.image, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
