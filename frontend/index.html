<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<text xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></text>">
<title>Carret 🥕</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="mode-toggle" href="/test.html">🧪 테스트 모드</a>

<main class="app">
  <header class="app-header">
    <h1>Carret 🥕</h1>
    <p class="subtitle">대충 찍은 사진 → 정직한 상품 사진</p>
  </header>

  <section class="upload-card">
    <div id="dropzone">
      <span class="dropzone-icon">📷</span>
      <span>사진 여러 장이나 동영상을 드래그하거나 클릭해서 선택</span>
      <span class="dropzone-help">여러 각도로 찍을수록 좋아요 — 동영상이면 한 바퀴 돌려 찍어 주세요</span>
    </div>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm,.jpg,.jpeg,.png,.webp,.mp4,.mov,.m4v,.webm" multiple hidden>

    <div class="or-divider"><span>또는</span></div>

    <div class="url-row">
      <input id="url-input" placeholder="이미지 URL 붙여넣기">
      <button id="url-run" class="btn btn-ghost">URL 업로드</button>
    </div>

    <div id="item-box" class="item-box hidden">
      <p id="item-summary" class="item-summary"></p>
      <div id="comp-wrap" class="hidden">
        <p class="step-label">구도 고르기</p>
        <div id="item-comps" class="item-comps" role="radiogroup" aria-label="구도"></div>
      </div>
      <p class="step-label">내 사진 <span class="step-sub">— 구도에 맞는 사진이 자동으로 골라져요. 직접 눌러도 돼요</span></p>
      <div id="item-photos" class="item-photos" role="radiogroup" aria-label="사진"></div>
      <div id="item-missing" class="item-missing hidden"></div>
      <button id="item-add" type="button" class="btn btn-ghost">사진 · 동영상 더 올리기</button>
      <input type="file" id="item-add-file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm,.jpg,.jpeg,.png,.webp,.mp4,.mov,.m4v,.webm" multiple hidden>
    </div>

    <div id="style-box" class="style-box hidden">
      <div id="analysis" class="analysis-line"></div>
      <p class="step-label">어디에 올릴 사진인가요?</p>
      <div id="purposes" class="segmented" role="radiogroup" aria-label="목적"></div>
      <p class="step-label">분위기</p>
      <div id="moods" class="mood-grid" role="radiogroup" aria-label="분위기"></div>
      <input id="note" class="note-input" maxlength="40"
             placeholder="원하는 분위기 한 줄 (선택) — 예: 캠핑 감성, 빈티지 카페">
      <p class="note-help">배경과 조명만 바뀌어요. 물건의 색·흠집·글자는 그대로 둬요.</p>
    </div>
    <button id="run" class="btn btn-primary btn-block" disabled>변환하기</button>
    <p id="status"></p>
  </section>

  <section class="result-grid">
    <div class="panel">
      <h3>원본</h3>
      <div class="image-frame">
        <img id="before" hidden>
      </div>
    </div>

    <div class="panel">
      <h3>결과</h3>

      <div id="meta-chips" class="meta-chips hidden">
        <span class="chip chip-item">📷 <span id="meta-item">—</span></span>
        <span id="meta-considered-wrap" class="hidden">
          <span class="meta-label">검사:</span>
          <span id="meta-considered"></span>
        </span>
      </div>

      <div id="after-wrap" class="viewport">
        <div class="canvas" id="result-canvas">
          <img id="after" hidden>
          <div id="overlay"></div>
        </div>
      </div>

      <p id="gate-badge" hidden></p>

      <div id="quality-box" class="quality-card hidden">
        <div class="scores" id="quality-scores"></div>
        <div class="analysis" id="quality-analysis"></div>
      </div>

      <div id="feedback-box" class="feedback-card hidden">
        <p class="feedback-title">이 결과가 어땠나요?</p>
        <div id="feedback-stars" class="stars">
          <button type="button" class="star" data-value="1">★</button>
          <button type="button" class="star" data-value="2">★</button>
          <button type="button" class="star" data-value="3">★</button>
          <button type="button" class="star" data-value="4">★</button>
          <button type="button" class="star" data-value="5">★</button>
        </div>
        <textarea id="feedback-comment" placeholder="코멘트 (선택)"></textarea>
        <button id="feedback-submit" class="btn btn-primary">피드백 보내기</button>
        <p id="feedback-status"></p>
      </div>
    </div>
  </section>
</main>

<!-- 순서 중요: render → api → main -->
<script src="js/render.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
